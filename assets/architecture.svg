<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740" role="img" aria-label="How Gateforge works">
  <rect width="1500" height="740" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA0A6"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1F2328; }
    .title { font-size: 28px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 700; }
    .cap { font-size: 14.5px; fill: #3A4150; }
    .note { font-size: 14.5px; fill: #3A4150; font-weight: 600; }
  </style>
  <text class="title" x="750" y="46" text-anchor="middle">How Gateforge works</text>

  <!-- You → Gateforge -->
  <line x1="244" y1="210" x2="474" y2="210" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="359" y="194" text-anchor="middle">Starts ./run_all.sh</text>

  <!-- Gateforge → kind -->
  <line x1="584" y1="210" x2="824" y2="210" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="704" y="194" text-anchor="middle">Provisions the lab</text>

  <!-- kind → engines -->
  <line x1="936" y1="210" x2="1224" y2="210" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1080" y="194" text-anchor="middle">Fires the same 14-manifest battery</text>

  <!-- Gateforge → Kali tools -->
  <line x1="530" y1="254" x2="530" y2="472" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="548" y="380">Runs Kali tools</text>

  <!-- Kali tools → policies -->
  <line x1="584" y1="520" x2="824" y2="520" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="704" y="504" text-anchor="middle">Feeds mappable findings</text>

  <!-- Kali tools → kind (probes), left hook in the mid band -->
  <path d="M 494 520 L 340 520 L 340 272 L 844 272" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="352" y="400">Probes the live cluster</text>

  <!-- engines → policies (gaps) -->
  <path d="M 1280 262 L 1280 360 L 930 360 L 930 476" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1105" y="344" text-anchor="middle">Admitted attacks become gaps</text>

  <!-- policies → kind (apply + re-run), dashed, right of kind column -->
  <path d="M 916 476 L 990 476 L 990 320 L 910 256" fill="none" stroke="#9AA0A6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text class="note" x="1008" y="400">Applies the policy and re-runs the attack</text>

  <!-- policies → scorecard -->
  <line x1="936" y1="520" x2="1234" y2="520" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1085" y="504" text-anchor="middle">Writes coverage and proofs</text>

  <!-- scorecard → you -->
  <path d="M 1280 564 L 1280 700 L 200 700 L 200 254" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="750" y="722" text-anchor="middle">Delivers the report</text>

  <!-- 1 You -->
  <text class="name" x="200" y="122" text-anchor="middle">You</text>
  <text class="cap" x="200" y="144" text-anchor="middle">Runs the lab, reads the scorecard</text>
  <circle cx="200" cy="210" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(200,212)" fill="#4B5563">
    <circle cx="0" cy="-9" r="8"/>
    <path d="M-15 16c1-9 6.8-13 15-13s14 4 15 13"/>
  </g>
  <circle cx="162" cy="190" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="162" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">1</text>

  <!-- 2 Gateforge -->
  <text class="name" x="530" y="122" text-anchor="middle">Gateforge</text>
  <text class="cap" x="530" y="144" text-anchor="middle">Orchestrates the closed loop</text>
  <circle cx="530" cy="210" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(512,192) scale(0.28)">
    <rect width="128" height="128" rx="28" fill="#161412"/>
    <circle cx="64" cy="82" r="30" fill="#3A2208"/>
    <path d="M30 108 V58 A34 34 0 0 1 98 58 V108" fill="none" stroke="#F3C15A" stroke-width="7" stroke-linecap="round"/>
    <path d="M40 72 H88" stroke="#F3C15A" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 72 V102 M64 72 V106 M80 72 V102" stroke="#E8A317" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M64 18 L70 40 L64 35 L58 40 Z" fill="#FF6B2B"/>
    <circle cx="64" cy="18" r="4" fill="#FFD27A"/>
  </g>
  <circle cx="492" cy="190" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="492" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">2</text>

  <!-- 3 kind cluster -->
  <text class="name" x="880" y="122" text-anchor="middle">kind cluster</text>
  <text class="cap" x="880" y="144" text-anchor="middle">Disposable admission-lab node</text>
  <circle cx="880" cy="210" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(880,210)">
    <rect x="-16" y="-10" width="22" height="16" rx="2.5" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <rect x="-6" y="-16" width="22" height="16" rx="2.5" fill="#F7F8F9" stroke="#181717" stroke-width="1.6"/>
    <rect x="-11" y="-2" width="22" height="16" rx="2.5" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
  </g>
  <circle cx="842" cy="190" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="842" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">3</text>

  <!-- 4 engines -->
  <text class="name" x="1280" y="114" text-anchor="middle">Admission engines</text>
  <text class="cap" x="1280" y="136" text-anchor="middle">Kyverno · Gatekeeper · PSA</text>
  <circle cx="1280" cy="210" r="44" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(1280,210)">
    <path d="M0 -18 L16 -10 V6 L0 16 L-16 6 V-10 Z" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M0 -8 L8 -4 V5 L0 10 L-8 5 V-4 Z" fill="#FFF4E8" stroke="#C2410C" stroke-width="1.3"/>
  </g>
  <circle cx="1234" cy="182" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="1234" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">4</text>

  <!-- 5 Kali tools -->
  <circle cx="530" cy="520" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(530,520)">
    <rect x="-20" y="-13" width="40" height="26" rx="4" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M-20-6h40" stroke="#181717" stroke-width="1.3"/>
    <circle cx="-13" cy="-9.5" r="1.5" fill="#E11D48"/>
    <circle cx="-8" cy="-9.5" r="1.5" fill="#D1D5DB"/>
    <circle cx="-3" cy="-9.5" r="1.5" fill="#D1D5DB"/>
    <text x="-14" y="9" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1F2328">$</text>
    <rect x="-6" y="3" width="16" height="2" rx="1" fill="#9AA0A6"/>
  </g>
  <circle cx="492" cy="500" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="492" y="504" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">5</text>
  <text class="name" x="530" y="592" text-anchor="middle">Kali tools</text>
  <text class="cap" x="530" y="614" text-anchor="middle">nmap · nuclei · peirates · trivy</text>

  <!-- 6 generated policies -->
  <circle cx="880" cy="520" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(880,520)">
    <path fill="#FFFFFF" stroke="#181717" stroke-width="1.6" d="M-13-18h16l10 10v26h-26z"/>
    <path fill="none" stroke="#181717" stroke-width="1.4" d="M3-18v10h10"/>
    <path d="M-7-2h14 M-7 4h14 M-7 10h9" stroke="#C2410C" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="842" cy="500" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="842" y="504" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">6</text>
  <text class="name" x="880" y="592" text-anchor="middle">Generated policies</text>
  <text class="cap" x="880" y="614" text-anchor="middle">Kyverno ValidatingPolicy YAML</text>

  <!-- 7 scorecard -->
  <circle cx="1280" cy="520" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(1280,520)">
    <rect x="-16" y="-16" width="32" height="32" rx="3" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M-16-6h32 M-16 4h32 M-5-16v32" stroke="#181717" stroke-width="1.2"/>
    <rect x="-14" y="-14" width="7" height="6" fill="#BBF7D0"/>
    <rect x="-3" y="-14" width="17" height="6" fill="#FECACA"/>
    <rect x="-14" y="-4" width="7" height="6" fill="#BBF7D0"/>
    <rect x="-3" y="-4" width="17" height="6" fill="#BBF7D0"/>
    <rect x="-14" y="6" width="7" height="8" fill="#BBF7D0"/>
    <rect x="-3" y="6" width="17" height="8" fill="#BBF7D0"/>
  </g>
  <circle cx="1234" cy="492" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="1234" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">7</text>
  <text class="name" x="1280" y="592" text-anchor="middle">Scorecard</text>
  <text class="cap" x="1280" y="614" text-anchor="middle">Matrix, HTML, proved-closed loop</text>
</svg>
