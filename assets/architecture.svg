<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-label="How the K8s Admission Attack Lab works">
  <rect width="1500" height="820" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA0A6"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1F2328; }
    .title { font-size: 28px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 700; }
    .cap { font-size: 14px; fill: #3A4150; }
    .note { font-size: 13.5px; fill: #3A4150; font-weight: 600; }
    .pathlab { font-size: 13px; fill: #C2410C; font-weight: 700; }
  </style>
  <text class="title" x="750" y="40" text-anchor="middle">How the K8s Admission Attack Lab works</text>

  <!-- Path A: You → CLI -->
  <path d="M 236 230 L 350 230 L 350 150 L 474 150" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="pathlab" x="300" y="214">Path A</text>
  <text class="note" x="300" y="248">CLI on Kali</text>

  <!-- Path B: You → Grok Bot -->
  <path d="M 224 274 L 224 340 L 474 340" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="pathlab" x="300" y="324">Path B</text>
  <text class="note" x="300" y="360">Grok Bot (optional)</text>

  <!-- Both paths converge on the kind cluster -->
  <line x1="584" y1="150" x2="824" y2="210" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="584" y1="340" x2="824" y2="246" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="720" y="188" text-anchor="middle">Same lab pipeline</text>
  <text class="note" x="720" y="206" text-anchor="middle">./run_all.sh</text>

  <!-- kind → engines -->
  <line x1="936" y1="230" x2="1224" y2="230" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1080" y="214" text-anchor="middle">Fires the same 14-manifest battery</text>

  <!-- kind → Kali tools, routed around the Grok Bot node -->
  <path d="M 880 274 L 880 430 L 568 430 L 568 486" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="760" y="450" text-anchor="middle">Runs Kali tools</text>

  <!-- Kali tools → kind (probes), left hook -->
  <path d="M 518 528 L 330 528 L 330 274 L 844 274" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="342" y="470">Probes the live cluster</text>

  <!-- Kali tools → policies -->
  <line x1="618" y1="540" x2="824" y2="540" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="720" y="524" text-anchor="middle">Feeds mappable findings</text>

  <!-- engines → policies (gaps) -->
  <path d="M 1280 282 L 1280 400 L 930 400 L 930 496" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1108" y="384" text-anchor="middle">Admitted attacks become gaps</text>

  <!-- policies → kind (apply + re-run) -->
  <path d="M 916 496 L 1004 496 L 1004 350 L 916 268" fill="none" stroke="#9AA0A6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text class="note" x="1020" y="440">Applies the policy and re-runs the attack</text>

  <!-- policies → scorecard -->
  <line x1="936" y1="540" x2="1234" y2="540" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="1085" y="524" text-anchor="middle">Writes coverage and proofs</text>

  <!-- scorecard → you -->
  <path d="M 1280 584 L 1280 780 L 200 780 L 200 274" fill="none" stroke="#9AA0A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="note" x="750" y="802" text-anchor="middle">Delivers the report</text>

  <!-- 1 You -->
  <text class="name" x="200" y="132" text-anchor="middle">You</text>
  <text class="cap" x="200" y="152" text-anchor="middle">Starts the lab, reads the scorecard</text>
  <circle cx="200" cy="230" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(200,232)" fill="#4B5563">
    <circle cx="0" cy="-9" r="8"/>
    <path d="M-15 16c1-9 6.8-13 15-13s14 4 15 13"/>
  </g>
  <circle cx="162" cy="210" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="162" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">1</text>

  <!-- 2a CLI on Kali -->
  <text class="name" x="520" y="78" text-anchor="middle">CLI on Kali</text>
  <text class="cap" x="520" y="98" text-anchor="middle">sudo ./run_all.sh</text>
  <circle cx="520" cy="150" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(520,150)">
    <rect x="-18" y="-13" width="36" height="26" rx="3" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M-18-6h36" stroke="#181717" stroke-width="1.3"/>
    <rect x="-13" y="-10.2" width="4" height="2.2" rx="1" fill="#9AA0A6"/>
    <rect x="-7" y="-10.2" width="4" height="2.2" rx="1" fill="#9AA0A6"/>
    <text x="-11" y="9" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1F2328">./</text>
  </g>
  <circle cx="482" cy="130" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="482" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">2a</text>

  <!-- 2b Grok Bot -->
  <circle cx="520" cy="340" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <image href="icons/grok-bot.png" x="496" y="318" width="48" height="42" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="482" cy="320" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="482" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">2b</text>
  <text class="name" x="630" y="336" text-anchor="start">Grok Bot</text>
  <text class="cap" x="630" y="356" text-anchor="start">Drives the same lab on Kali</text>

  <!-- 3 kind cluster -->
  <text class="name" x="880" y="132" text-anchor="middle">kind cluster</text>
  <text class="cap" x="880" y="152" text-anchor="middle">Disposable admission-lab node</text>
  <circle cx="880" cy="230" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(880,230)">
    <rect x="-16" y="-10" width="22" height="16" rx="2.5" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <rect x="-6" y="-16" width="22" height="16" rx="2.5" fill="#F7F8F9" stroke="#181717" stroke-width="1.6"/>
    <rect x="-11" y="-2" width="22" height="16" rx="2.5" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
  </g>
  <circle cx="842" cy="210" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="842" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">3</text>

  <!-- 4 engines -->
  <text class="name" x="1280" y="124" text-anchor="middle">Admission engines</text>
  <text class="cap" x="1280" y="144" text-anchor="middle">Kyverno · Gatekeeper · PSA</text>
  <circle cx="1280" cy="230" r="44" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(1280,230)">
    <path d="M0 -18 L16 -10 V6 L0 16 L-16 6 V-10 Z" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M0 -8 L8 -4 V5 L0 10 L-8 5 V-4 Z" fill="#FFF4E8" stroke="#C2410C" stroke-width="1.3"/>
  </g>
  <circle cx="1234" cy="202" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="1234" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">4</text>

  <!-- 5 Kali tools: official Kali Linux dragon logomark, unmodified -->
  <circle cx="560" cy="540" r="42" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(529.00,509.00) scale(0.457666)">
    <path d="m71.766572 36.353532s-10.212-.6795-27.602 4.7619c-17.722 5.5452-27.773 13.405-27.773 13.405s26.414-14.748 56.228-15.586zm38.089998 16.035 1.3276-.08664s-7.6062-9.2286-22.164998-13.724c8.1839 3.3267 15.306998 7.7345 20.836998 13.81zm2.1727 3.8344c.20411-.3539.86302 1.1243 1.3634 1.7453.0212.124.0564.19967-.23373.13998-.0244-.12747-.0665-.16444-.0665-.16444s-.70029-.41667-.91499-.71224c-.21487-.29556-.253-.81255-.14825-1.0086zm17.867 43.930008s1.6147-18.538008-27.511-22.812008c-3.691498-.54163-8.359898-.9585-13.081998-.97044-23.344.30865-24.195-26.924-6.6044-28.299 7.2901-.60152 15.995 3.3311 24.504998 7.2941-.0316 1.0569.0121 1.9961.70646 2.864.69414.86762 3.3607 1.8142 4.2128 2.3031.85203.48907 3.5816 2.2245 5.2543 4.4017.36275-.67854 3.3921-2.6504 3.3921-2.6504s-.72571.01579-2.414-.61519c-1.6885-.63098-3.6921-2.5401-3.7395-2.6504-.0473-.11052-.0788-.28401.31578-.36295.2996-.25224-.37893-1.0727-.67874-1.3723-.2996-.2998-2.3036-3.7073-2.3508-3.7863-.0473-.07894-.0632-.1577-.20507-.25243-.4419-.1421-2.3826.20506-2.3826.20506s-2.9847-1.4659-4.0135-4.6264c.015.55358-.5118 1.158 0 2.4298-1.5562-.65832-2.8929-1.7811-3.9472-4.5557-.62751 1.5781 0 2.5815 0 2.5815s-3.664598-1.024-4.250898-4.4036c-.6435 1.5171 0 2.4296 0 2.4296s-5.9742-3.1172-15.901-3.1624c-6.646-.60961-8.0296-12.301-7.4139-14.269 0 0-9.586-5.0521-28.456-7.2841-18.87-2.2322-34.346-.33638-34.346-.33638s33.421-1.6039 60.195 9.2356c.91018 4.0709 3.6482 10.851 5.1229 14.11-4.2197 2.9175-8.9781 5.6609-9.7191 15.391-.74074 9.7297 7.6245 18.288 17.998 18.552 9.8502.52469 16.655998.59921 24.904998 4.8759 7.8739 4.3537 14.33 17.620008 14.969 29.551008.69008-8.8524-2.632-27.889008-18.134-33.669008 21.667 3.7917 23.573 19.854008 23.573 19.854008zm-58.639998-65.253008-.77963-2.5147s-12.864-2.2844-30.16-1.055-34.759 7.2839-34.759 7.2839 35.732-8.991 65.698-3.7143"/>
  </g>
  <circle cx="516" cy="514" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="516" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">5</text>
  <text class="name" x="560" y="616" text-anchor="middle">Kali tools</text>
  <text class="cap" x="560" y="636" text-anchor="middle">nmap · nuclei · peirates · trivy</text>

  <!-- 6 generated policies -->
  <circle cx="880" cy="540" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(880,540)">
    <path fill="#FFFFFF" stroke="#181717" stroke-width="1.6" d="M-13-18h16l10 10v26h-26z"/>
    <path fill="none" stroke="#181717" stroke-width="1.4" d="M3-18v10h10"/>
    <path d="M-7-2h14 M-7 4h14 M-7 10h9" stroke="#C2410C" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="842" cy="520" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="842" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">6</text>
  <text class="name" x="880" y="616" text-anchor="middle">Generated policies</text>
  <text class="cap" x="880" y="636" text-anchor="middle">Kyverno ValidatingPolicy YAML</text>

  <!-- 7 scorecard -->
  <circle cx="1280" cy="540" r="36" fill="#F7F8F9" stroke="#E4E6EA" stroke-width="1.5"/>
  <g transform="translate(1280,540)">
    <rect x="-16" y="-16" width="32" height="32" rx="3" fill="#FFFFFF" stroke="#181717" stroke-width="1.6"/>
    <path d="M-16-6h32 M-16 4h32 M-5-16v32" stroke="#181717" stroke-width="1.2"/>
    <rect x="-14" y="-14" width="7" height="6" fill="#BBF7D0"/>
    <rect x="-3" y="-14" width="17" height="6" fill="#FECACA"/>
    <rect x="-14" y="-4" width="7" height="6" fill="#BBF7D0"/>
    <rect x="-3" y="-4" width="17" height="6" fill="#BBF7D0"/>
    <rect x="-14" y="6" width="7" height="8" fill="#BBF7D0"/>
    <rect x="-3" y="6" width="17" height="8" fill="#BBF7D0"/>
  </g>
  <circle cx="1234" cy="512" r="11" fill="#FFF4E8" stroke="#F3D5B0"/>
  <text x="1234" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">7</text>
  <text class="name" x="1280" y="616" text-anchor="middle">Scorecard</text>
  <text class="cap" x="1280" y="636" text-anchor="middle">Matrix, HTML, proved-closed loop</text>
</svg>
