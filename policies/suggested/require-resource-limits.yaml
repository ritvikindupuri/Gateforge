apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  labels:
    lab.component: suggested-policy
    lab.closes: no-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: Admission Lab suggested
    policies.kyverno.io/description: Auto-generated to close the 'no-limits' gap found by the admission-time attack battery.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        has(c.resources) && has(c.resources.limits)
        && has(c.resources.limits.cpu) && has(c.resources.limits.memory))
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        has(c.resources) && has(c.resources.limits)
        && has(c.resources.limits.cpu) && has(c.resources.limits.memory)))
      message: Every container must set resources.limits.cpu and resources.limits.memory.
