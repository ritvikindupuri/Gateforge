apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  labels:
    lab.component: suggested-policy
    lab.closes: untrusted-registry
  annotations:
    policies.kyverno.io/title: Allow only docker.io / short-name official images
    policies.kyverno.io/category: Admission Lab suggested
    policies.kyverno.io/description: Auto-generated to close the 'untrusted-registry' gap found by the admission-time attack battery.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        c.image.startsWith("docker.io/") || !c.image.contains("/") || !c.image.split("/")[0].contains("."))
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        c.image.startsWith("docker.io/") || !c.image.contains("/") || !c.image.split("/")[0].contains(".")))
      message: Images must come from docker.io or use a short name (no third-party registry host).
