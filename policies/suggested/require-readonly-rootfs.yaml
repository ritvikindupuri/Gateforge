apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-readonly-rootfs
  labels:
    lab.component: suggested-policy
    lab.closes: writable-rootfs
  annotations:
    policies.kyverno.io/title: Require read-only root filesystem
    policies.kyverno.io/category: Admission Lab suggested
    policies.kyverno.io/description: Auto-generated to close the 'writable-rootfs' gap found by the admission-time attack battery.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem == true)
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem == true))
      message: Every container must set securityContext.readOnlyRootFilesystem=true.
