apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-latest-tag
  labels:
    lab.component: suggested-policy
    lab.closes: latest-tag
  annotations:
    policies.kyverno.io/title: Deny mutable :latest (or untagged) images
    policies.kyverno.io/category: Admission Lab suggested
    policies.kyverno.io/description: Auto-generated to close the 'latest-tag' gap found by the admission-time attack battery.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        c.image.contains("@sha256:") || (c.image.contains(":") && !c.image.endsWith(":latest")))
        && (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
        c.image.contains("@sha256:") || (c.image.contains(":") && !c.image.endsWith(":latest"))))
      message: Image tags must be pinned. ':latest' and untagged images are not allowed.
