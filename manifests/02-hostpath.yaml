apiVersion: v1
kind: Pod
metadata:
  name: att-hostpath
  namespace: admission-lab
  labels:
    lab.scenario: hostpath
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-etc
          mountPath: /host-etc
  volumes:
    - name: host-etc
      hostPath:
        path: /etc
        type: Directory
