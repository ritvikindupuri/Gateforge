apiVersion: v1
kind: Pod
metadata:
  name: att-run-as-root
  namespace: admission-lab
  labels:
    lab.scenario: run-as-root
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
