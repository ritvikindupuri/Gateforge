apiVersion: v1
kind: Pod
metadata:
  name: att-docker-sock
  namespace: admission-lab
  labels:
    lab.scenario: docker-sock
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
  volumes:
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
        type: Socket
