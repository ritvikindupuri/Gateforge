apiVersion: v1
kind: Pod
metadata:
  name: peirates-hostpath-attempt
  namespace: kali-probe
  labels:
    lab.component: peirates-attempt
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "30"]
      volumeMounts:
        - name: host-root
          mountPath: /host
      securityContext:
        allowPrivilegeEscalation: false
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
